<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ExpoTécnica MEP{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="font-bold text-lg tracking-wide flex items-center">
                <i class="fa-solid fa-graduation-cap text-yellow-400 mr-2 text-xl"></i> EXPOTÉCNICA <span class="text-xs bg-indigo-700 px-2 py-0.5 rounded ml-2 text-indigo-200">ADMIN</span>
            </a>
            <nav class="flex items-center space-x-3 text-sm font-medium">
                <a href="/" class="hover:text-indigo-200 px-2 py-1">Inicio</a>
                <a href="/admin/proyectos" class="hover:text-indigo-200 px-2 py-1">Proyectos</a>
                <a href="/admin/jueces" class="hover:text-indigo-200 px-2 py-1">Jueces</a>
                <a href="/admin/ganadores" class="bg-yellow-500 hover:bg-yellow-400 text-slate-900 px-3 py-1 rounded-lg font-bold transition flex items-center">
                    <i class="fa-solid fa-trophy mr-1.5"></i> Ganadores
                </a>
                <a href="/logout" title="Cerrar Sesión" class="bg-red-700 hover:bg-red-800 px-3 py-1.5 rounded-lg text-xs font-bold transition ml-2">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Salir
                </a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-slate-900 text-slate-400 text-xs py-4 text-center">
        Sistema de Evaluación Institucional — Ministerio de Educación Pública
    </footer>
</body>
</html>
