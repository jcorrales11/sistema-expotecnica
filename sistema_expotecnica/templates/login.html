<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - ExpoTécnica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full space-y-6 border border-slate-700">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Panel de Administración</h1>
            <p class="text-xs text-slate-500">Acceso exclusivo para coordinadores de ExpoTécnica</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-lg text-center font-medium">
            <i class="fa-solid fa-circle-exclamation mr-1"></i> {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Contraseña de Administrador</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-2.5 rounded-xl text-sm shadow-md transition">
                Ingresar al Sistema
            </button>
        </form>

        <p class="text-[11px] text-center text-slate-400">
            Los jueces evaluadores no necesitan clave, ingresan escaneando su código QR personal.
        </p>
    </div>

</body>
</html>
